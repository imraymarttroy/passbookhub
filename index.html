<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="PassbookHub: a minimalist budget tracker built on the 50/30/20 rule.">
  <title>PassbookHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23272635'/%3E%3Cpath d='M7 22h18M7 16h11M7 10h7' stroke='%23b1e5f2' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('pbh.ziery.') === 0) localStorage.removeItem(k); }); } catch (e) {}</script>
  <script>try { var t = localStorage.getItem('pbh.theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#272635">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PassbookHub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    /* Installable app: register the service worker and keep the browser's install prompt for the "Install app" button. */
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__pbhInstall = e; document.dispatchEvent(new Event('pbh-installable')); });
    window.addEventListener('appinstalled', function () { window.__pbhInstall = null; document.dispatchEvent(new Event('pbh-installable')); });
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  </script>
  <link rel="stylesheet" href="styles.css?v=108">
</head>
<body>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">This budget tracker needs JavaScript to run.</p></noscript>
  <script src="config.js?v=4"></script>
  <script type="module" src="js/firebase.js?v=93"></script>
</body>
</html>
